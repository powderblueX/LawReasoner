version: '3.8'

services:
  api_gateway:
    build:
      context: .
      dockerfile: ./api_gateway/Dockerfile
    volumes:
      - ./api_gateway:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - auth_service
      - reasoning_service
      - knowledge_service
    networks:
      - law_reasoner_net

  auth_service:
    build:
      context: .
      dockerfile: ./auth_service/Dockerfile
    volumes:
      - ./auth_service:/app
      - ./data/auth_service_db:/app/data
    ports:
      - "8001:8001"
    env_file:
      - .env
    networks:
      - law_reasoner_net

  reasoning_service:
    build:
      context: .
      dockerfile: ./reasoning_service/Dockerfile
    volumes:
      - ./reasoning_service:/app
      - ./data/reasoning_service_db:/app/data
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      - knowledge_service
    networks:
      - law_reasoner_net

  knowledge_service:
    build:
      context: .
      dockerfile: ./knowledge_service/Dockerfile
    volumes:
      - ./knowledge_service:/app
      - ./data/knowledge_service_db:/app/data
      - ./data/knowledge:/app/data/knowledge
    ports:
      - "8003:8003"
    env_file:
      - .env
    networks:
      - law_reasoner_net

networks:
  law_reasoner_net:
    driver: bridge 