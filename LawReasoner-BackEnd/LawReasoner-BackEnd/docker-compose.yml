version: '3.8'

services:
  api_gateway:
    build:
      context: .
      dockerfile: ./api_gateway/Dockerfile
    volumes:
      - ./api_gateway:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - auth_service
      - profile_service
      - contract_service
      - reasoning_service
    networks:
      - law_reasoner_net

  auth_service:
    build:
      context: .
      dockerfile: ./auth_service/Dockerfile
    volumes:
      - ./auth_service:/app
      - ./data/auth_service_db:/app/data
    ports:
      - "8001:8001"
    env_file:
      - .env
    networks:
      - law_reasoner_net

  profile_service:
    build:
      context: .
      dockerfile: ./profile_service/Dockerfile
    volumes:
      - ./profile_service:/app
      - ./data/profile_service_db:/app/data
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      - auth_service
    networks:
      - law_reasoner_net

  contract_service:
    build:
      context: .
      dockerfile: ./contract_service/Dockerfile
    volumes:
      - ./contract_service:/app
      - ./data/contract_service_db:/app/data
      - ./contracts:/app/contracts
    ports:
      - "8003:8003"
    env_file:
      - .env
    networks:
      - law_reasoner_net

  reasoning_service:
    build:
      context: .
      dockerfile: ./reasoning_service/Dockerfile
    volumes:
      - ./reasoning_service:/app
      - ./data/reasoning_service_db:/app/data
    ports:
      - "8004:8004"
    env_file:
      - .env
    networks:
      - law_reasoner_net


networks:
  law_reasoner_net:
    driver: bridge 